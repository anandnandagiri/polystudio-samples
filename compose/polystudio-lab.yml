# =============================================================================
#  Poly Studio - Evaluation Lab
#  A self-contained stack of sample databases + an SSH sidecar that Poly Studio
#  connects to through a real SSH tunnel (exactly like a production host).
#
#  Usage:
#     git clone https://github.com/anandnandagiri/polystudio-samples.git
#     cd polystudio-samples
#     docker compose -f compose/polystudio-lab.yml up -d
#
#  Then, in Poly Studio:  Connectors -> Import Lab Pack (pick this folder).
#
#  Nothing here is published to your host except the SSH port on 127.0.0.1.
#  The databases are reachable ONLY through the SSH tunnel, which is how
#  Poly Studio is designed to reach a private network.
# =============================================================================
name: polystudio-lab

services:

  # ---------------------------------------------------------------------------
  #  lab-ssh - SSH sidecar.
  #
  #  This is the "remote host" Poly Studio talks to. It runs a real sshd and it
  #  has the Docker socket mounted, so the Docker Studio module sees the REAL
  #  containers of this lab (not a simulation).
  #
  #  Because lab-ssh shares the `lab` network with the database containers,
  #  Poly Studio's SSH tunnel can reach the databases by their compose service
  #  name (postgres, mysql, sqlserver). That is the whole point: every query
  #  travels over the tunnel.
  # ---------------------------------------------------------------------------
  lab-ssh:
    image: docker:cli
    container_name: poly-lab-ssh
    hostname: poly-lab-ssh
    ports:
      # Bound to loopback only - never exposed to the LAN.
      - "127.0.0.1:2222:22"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - lab
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache openssh >/dev/null
        ssh-keygen -A >/dev/null
        # CRITICAL: Alpine's openssh package ships "AllowTcpForwarding no" in
        # /etc/ssh/sshd_config. PolyStudio's SSH tunnel is a TCP port
        # forward, so without this the tunnel opens but every forwarded
        # connection is silently dropped. This directive is the whole point
        # of the sidecar.
        printf '%s\n' \
          'PermitRootLogin yes' \
          'PasswordAuthentication yes' \
          'AllowTcpForwarding yes' \
          'GatewayPorts no' \
          'X11Forwarding no' \
          > /etc/ssh/sshd_config
        echo 'root:PolyDemo123!' | chpasswd
        echo "lab-ssh ready (root / PolyDemo123!) - TCP forwarding enabled"
        exec /usr/sbin/sshd -D

  # ---------------------------------------------------------------------------
  #  postgres - Chinook (digital media store) on PostgreSQL 16.
  #  12 tables, 24 bulk INSERT statements, ~15k rows.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16
    container_name: poly-lab-postgres
    # Modest memory settings so the whole lab fits on a small machine (a
    # Raspberry Pi running 4 databases at once is tight). The defaults
    # (128 MB shared buffers, 100 connections each) add up quickly.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: poly
      POSTGRES_PASSWORD: poly
      POSTGRES_DB: chinook
    volumes:
      - ../packs/chinook-postgres/Chinook_PostgreSql.sql:/docker-entrypoint-initdb.d/10-chinook.sql:ro
    networks:
      - lab
    healthcheck:
      # -h 127.0.0.1 is essential: pg_isready uses the unix socket by default,
      # and during the init phase the image runs a temporary server that listens
      # ONLY on that socket while it loads the seed scripts. A socket check
      # therefore reports "healthy" while the database is still loading, and a
      # client that reaches the container over TCP (which is what the SSH
      # tunnel does) gets its connection closed. The TCP check tells the truth.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U poly -d chinook"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  #  postgres-sakila - Sakila (film rental) on PostgreSQL 16.
  #  22 tables (payment is partitioned by month), ~160k rows.
  #
  #  The superuser is deliberately "poly", NOT "postgres": the Sakila dump
  #  ends with "REASSIGN OWNED BY postgres TO sakila", and that fails when
  #  "postgres" is the bootstrap superuser because it then owns the system
  #  catalogs ("required by the database system"). 00-roles.sql creates
  #  "postgres" as an ordinary role that owns only the Sakila objects.
  # ---------------------------------------------------------------------------
  postgres-sakila:
    image: postgres:16
    container_name: poly-lab-postgres-sakila
    # See the note on the "postgres" service - the Sakila dataset is by far
    # the largest in the lab, so it needs the smaller footprint most.
    command: ["postgres", "-c", "shared_buffers=64MB", "-c", "max_connections=50"]
    environment:
      POSTGRES_USER: poly
      POSTGRES_PASSWORD: poly
      POSTGRES_DB: sakila
    volumes:
      - ../packs/sakila-postgres/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
      - ../packs/sakila-postgres/1-postgres-sakila-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../packs/sakila-postgres/2-postgres-sakila-insert-data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
      - ../packs/sakila-postgres/3-postgres-sakila-user.sql:/docker-entrypoint-initdb.d/30-user.sql:ro
    networks:
      - lab
    healthcheck:
      # -h 127.0.0.1, see the note on the "postgres" service: the socket
      # check would report ready while the Sakila seed is still running.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U poly -d sakila"]
      interval: 5s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------------------
  #  mysql - Sakila (film rental) on MySQL 8.
  #  16 tables + views + stored procedures + functions + triggers, ~600k rows.
  # ---------------------------------------------------------------------------
  mysql:
    image: mysql:8
    container_name: poly-lab-mysql
    # A small InnoDB buffer pool keeps the MySQL and MariaDB Sakila instances
    # (about 600k rows each) inside a small machine's memory budget.
    command: --innodb-buffer-pool-size=64M
    environment:
      MYSQL_ROOT_PASSWORD: poly
      MYSQL_DATABASE: sakila
    volumes:
      - ../packs/sakila-mysql/1-sakila-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../packs/sakila-mysql/2-sakila-data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
    networks:
      - lab
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-ppoly"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------
  #  mariadb - Sakila (film rental) on MariaDB 11.
  #  Same dataset, different engine - ideal for the Schema Compare demo.
  # ---------------------------------------------------------------------------
  mariadb:
    image: mariadb:11
    container_name: poly-lab-mariadb
    # See the note on the "mysql" service.
    command: --innodb-buffer-pool-size=64M
    environment:
      MARIADB_ROOT_PASSWORD: poly
      MARIADB_DATABASE: sakila
    volumes:
      - ../packs/sakila-mysql/1-sakila-schema.sql:/docker-entrypoint-initdb.d/10-schema.sql:ro
      - ../packs/sakila-mysql/2-sakila-data.sql:/docker-entrypoint-initdb.d/20-data.sql:ro
    networks:
      - lab
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  # ---------------------------------------------------------------------------
  #  sqlserver - Chinook on SQL Server 2022.
  #
  #  The official Microsoft image has NO /docker-entrypoint-initdb.d support,
  #  so the sample data is loaded by a one-shot `sqlcmd` job (see below) that
  #  waits for the server to accept connections first.
  #
  #  PROFILE "x64": mcr.microsoft.com/mssql/server:2022-latest is published
  #  for linux/amd64 ONLY - the tag has no arm64 variant at all. On a
  #  Raspberry Pi (or any arm64 host) pulling it either fails outright or
  #  drags in a 600 MB amd64 image that then has to run under emulation.
  #  Putting the service behind a profile means `docker compose up` simply
  #  leaves it out on arm64 instead of failing the whole stack.
  #
  #  On x64 the profile is enabled explicitly:
  #      docker compose -f compose/polystudio-lab.yml --profile x64 up -d
  #  Poly Studio shows the command that matches the machine it runs on.
  # ---------------------------------------------------------------------------
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poly-lab-sqlserver
    profiles: ["x64"]
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PolyDemo123!"
      MSSQL_PID: Developer
    networks:
      - lab
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s

  # ---------------------------------------------------------------------------
  #  sqlserver-init - one-shot job that loads the Chinook script.
  #  Runs to completion and exits; `docker compose up -d` returns immediately.
  # ---------------------------------------------------------------------------
  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: poly-lab-sqlserver-init
    profiles: ["x64"]
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PolyDemo123!"
    volumes:
      - ../packs/chinook-sqlserver/Chinook_SqlServer.sql:/data/Chinook_SqlServer.sql:ro
    networks:
      - lab
    entrypoint:
      - /bin/bash
      - -c
      - |
        set -e
        # NOTE: '$$' escapes the variable for docker compose so it is not
        # interpolated on the host - the shell inside the container sees '$'.
        SQLCMD=/opt/mssql-tools18/bin/sqlcmd
        if [ ! -x "$$SQLCMD" ]; then SQLCMD=/opt/mssql-tools/bin/sqlcmd; fi
        EXISTS=$$("$$SQLCMD" -S sqlserver -U sa -P "PolyDemo123!" -C -h -1 -W -Q "SET NOCOUNT ON; IF DB_ID('Chinook') IS NOT NULL SELECT 1" 2>/dev/null || true)
        case "$$EXISTS" in
          *1*)
            echo "[init] Chinook database already exists in SQL Server, skipping seed."
            exit 0
            ;;
        esac
        echo "[init] loading Chinook into SQL Server..."
        # -b makes sqlcmd exit non-zero on error so a failed load is visible.
        "$$SQLCMD" -S sqlserver -U sa -P "PolyDemo123!" -C -b -i /data/Chinook_SqlServer.sql
        echo "[init] Chinook loaded."

networks:
  lab:
    name: polystudio-lab
    driver: bridge
